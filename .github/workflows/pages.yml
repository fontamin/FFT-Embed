# Publishes the embed to GitHub Pages from the main branch.
# Only the files the site needs are published (README, LICENSE and this folder stay out).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits for the running one instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Collect the site files
        # a missing file stops the deployment, so a half site never goes online
        run: |
          mkdir _site
          cp index.html embed.js embed-frame.html embed-frame.css embed-frame.js brotli.js _site/

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
